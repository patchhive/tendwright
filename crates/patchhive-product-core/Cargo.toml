[package]
name = "patchhive-product-core"
version = "0.1.0"
edition = "2021"
description = "Shared Rust backend primitives for PatchHive products."
license = "MIT"
repository = "https://github.com/patchhive/patchhive-product-core.git"
homepage = "https://github.com/patchhive/patchhive-product-core"
keywords = ["patchhive", "rust", "backend", "auth"]

[lib]
name = "patchhive_product_core"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
fs2 = "0.4"
libc = "0.2"
hex = "0.4"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# `rt` only: the write-authorization guard needs a runtime handle to release an
# abandoned reservation from Drop. Products bring their own full tokio.
tokio = { version = "1", default-features = false, features = ["rt"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
