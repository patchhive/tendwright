name: Frontend Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - products/dep-triage/frontend
          - products/flake-sting/frontend
          - products/hive-core/frontend
          - products/merge-keeper/frontend
          - products/refactor-scout/frontend
          - products/release-sentry/frontend
          - products/repo-memory/frontend
          - products/repo-reaper/frontend
          - products/review-bee/frontend
          - products/signal-hive/frontend
          - products/trust-gate/frontend
          - products/vuln-triage/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build ${{ matrix.workspace }}
        run: npm --prefix "${{ matrix.workspace }}" run build
