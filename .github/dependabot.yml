version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Keep routine upgrades and breaking upgrades reviewable without opening
    # one pull request per dependency.
    groups:
      npm-compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-breaking-updates:
        patterns:
          - "*"
        update-types:
          - major

  # The root virtual workspace owns every monorepo Rust package and lockfile;
  # compatible and breaking upgrades each get one bounded review surface.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      rust-breaking-updates:
        patterns:
          - "*"
        update-types:
          - major
