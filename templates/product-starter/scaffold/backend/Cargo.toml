[package]
name = "__PRODUCT_SLUG__"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "__PRODUCT_SLUG__"
path = "src/main.rs"

[lib]
name = "__PRODUCT_CRATE__"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
patchhive-product-core = { path = "__MONOREPO_PREFIX__/crates/patchhive-product-core" }
