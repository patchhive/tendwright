key = "repo-reaper"
code = "RR"
name = "RepoReaper"
role = "autonomous patch and PR execution"
module_path = "repo_reaper"
route_prefix = "/api/products/repo-reaper"

[display]
order = 11
icon = "⚔"
lane = "Action"
description = "Finds issues, generates fixes, validates them, and opens autonomous pull requests."
repository = "patchhive/reporeaper"
frontend_url = "http://localhost:5173"
api_url = "http://localhost:8000"

[smoke]
tiers = ["first-stack", "write-dry-run"]
acknowledged_startup = [{ code = "webhook_secret", status = "missing" }]

[smoke.action]
id = "dry_run"
timeout_seconds = 45

[smoke.action.payload]
language = "rust"
min_stars = 0
max_repos = 1
max_issues = 1
labels = ["bug"]
concurrency = 1
search_query = "repo:patchhive/patchhive2 is:issue is:open"
cost_budget_usd = 0.0
retry_count = 0

[safety]
read_only = false
writes_external_state = true
mutates_repositories = true
opens_pull_requests = true
requires_operator_approval = true
# github:issues:read is required by dry_run, which hunts candidate issues without
# writing. It was missing here while the engine advertised it.
credential_scopes = ["github:contents:write", "github:pull_requests:write", "provider:ai", "github:issues:read"]
evidence_required = ["issue URL", "generated patch", "test result", "TrustGate decision"]

[health]
endpoint = "/api/products/repo-reaper/health"
timeout_ms = 2000
healthy_status = 200

[[capabilities]]
id = "issue-hunt"
label = "Issue hunt"
description = "Find candidate bug issues."

[[capabilities]]
id = "patch-generation"
label = "Patch generation"
description = "Generate, review, and validate candidate patches."
mutating = true

[[capabilities]]
id = "pull-request"
label = "Pull request"
description = "Open attributed PatchHive pull requests."
mutating = true

[[capabilities]]
id = "maintainer-follow-up"
label = "Maintainer follow-up"
description = "Apply approved review feedback to a RepoReaper-owned draft pull request or post one exact approved reply."
mutating = true

[[routes]]
method = "GET"
path = "/api/products/repo-reaper/health"
description = "Report RepoReaper runtime health."

[[routes]]
method = "POST"
path = "/api/products/repo-reaper/auth/login"
description = "Validate a RepoReaper API key."

[[routes]]
method = "GET"
path = "/api/products/repo-reaper/auth/status"
description = "Read RepoReaper auth bootstrap state."

[[routes]]
method = "POST"
path = "/api/products/repo-reaper/auth/generate-key"
description = "Generate the first local RepoReaper API key."

[[routes]]
method = "POST"
path = "/api/products/repo-reaper/auth/generate-service-token"
description = "Generate a RepoReaper service token for HiveCore."

[[routes]]
method = "POST"
path = "/api/products/repo-reaper/auth/rotate-service-token"
description = "Rotate the RepoReaper service token."

[[routes]]
