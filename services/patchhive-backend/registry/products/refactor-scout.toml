key = "refactor-scout"
code = "RS"
name = "RefactorScout"
role = "conservative refactor discovery"
module_path = "refactor_scout"
route_prefix = "/api/products/refactor-scout"

[display]
order = 9
icon = "🧭"
lane = "Quality"
description = "Surfaces safe refactor opportunities before code health drift compounds."
repository = "patchhive/refactorscout"
frontend_url = "http://localhost:5182"
api_url = "http://localhost:8090"

[smoke]
tiers = ["read-only-fleet"]
acknowledged_startup = [
  { code = "api_key_auth", status = "missing" },
  { code = "allowed_roots", status = "defaulted" },
]

[safety]
read_only = true
credential_scopes = ["local:filesystem:read", "github:public-repo:clone"]
evidence_required = ["local path allowlist or temporary GitHub clone", "file metrics", "ranking reason"]

[health]
endpoint = "/api/products/refactor-scout/health"
timeout_ms = 2000
healthy_status = 200

[[capabilities]]
id = "local-scan"
label = "Repo scan"
description = "Scan explicitly allowed local repository paths or public GitHub repositories."

[[capabilities]]
id = "repo-discovery"
label = "Autonomous discovery"
description = "Select an eligible public GitHub repository from a bounded saved scope while avoiding recent repeats."

[[capabilities]]
id = "refactor-candidates"
label = "Refactor candidates"
description = "Surface conservative cleanup opportunities."

[[capabilities]]
id = "read-only"
label = "Read-only"
description = "Does not rewrite local files."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/health"
description = "Report RefactorScout runtime health."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/auth/status"
description = "Read RefactorScout auth bootstrap state."

[[routes]]
method = "POST"
path = "/api/products/refactor-scout/auth/login"
description = "Validate a RefactorScout API key."

[[routes]]
method = "POST"
path = "/api/products/refactor-scout/auth/generate-key"
description = "Generate the first local RefactorScout API key."

[[routes]]
method = "POST"
path = "/api/products/refactor-scout/auth/generate-service-token"
description = "Generate a RefactorScout service token for HiveCore."

[[routes]]
method = "POST"
path = "/api/products/refactor-scout/auth/rotate-service-token"
description = "Rotate the RefactorScout service token."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/startup/checks"
description = "Read RefactorScout startup checks."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/capabilities"
description = "Read RefactorScout product capabilities."

[[routes]]
method = "POST"
path = "/api/products/refactor-scout/scan/local"
description = "Scan a local repo path or public GitHub repository for refactor opportunities."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/runs"
description = "List RefactorScout scans."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/runs/{id}"
description = "Read a RefactorScout scan detail."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/overview"
description = "Read RefactorScout overview metrics and recent scans."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/history"
description = "List RefactorScout scan history."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/history/{id}"
description = "Read a RefactorScout scan detail."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/presets"
description = "List saved RefactorScout target and discovery presets."

[[routes]]
method = "POST"
path = "/api/products/refactor-scout/presets"
description = "Save a RefactorScout target or discovery preset."

[[routes]]
method = "DELETE"
path = "/api/products/refactor-scout/presets/{name}"
description = "Delete a RefactorScout preset."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/schedules"
description = "List RefactorScout schedules and their explicit target modes."

[[routes]]
method = "POST"
path = "/api/products/refactor-scout/schedules"
description = "Save a target-repo or autonomous-discovery RefactorScout schedule."

[[routes]]
method = "DELETE"
path = "/api/products/refactor-scout/schedules/{name}"
description = "Delete a RefactorScout schedule."

[[routes]]
method = "POST"
path = "/api/products/refactor-scout/schedules/{name}/run"
description = "Run a saved RefactorScout schedule immediately."

[[routes]]
method = "GET"
path = "/api/products/refactor-scout/repo-lists"
description = "List RefactorScout repository allowlist, denylist, and opt-out controls."

[[routes]]
method = "POST"
path = "/api/products/refactor-scout/repo-lists"
description = "Save a RefactorScout repository control."

[[routes]]
method = "DELETE"
path = "/api/products/refactor-scout/repo-lists/{*repo}"
description = "Remove a RefactorScout repository control."
