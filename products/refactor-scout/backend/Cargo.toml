[package]
name = "refactor-scout"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "refactor-scout"
path = "src/main.rs"

[lib]
name = "refactor_scout"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
patchhive-product-core = { path = "../../../crates/patchhive-product-core" }
patchhive-github-data = { path = "../../../crates/patchhive-github-data" }
